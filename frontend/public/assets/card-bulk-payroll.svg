<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022C22" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad4)" rx="16" />

  <!-- Payroll Matrix Table Simulation -->
  <rect x="100" y="60" width="600" height="310" rx="12" fill="#064E3B" fill-opacity="0.25" stroke="#059669" stroke-width="1.5" />
  
  <rect x="100" y="60" width="600" height="44" rx="12" fill="#065F46" fill-opacity="0.5" />
  <g font-family="monospace" font-size="12" font-weight="bold" fill="#A7F3D0">
    <text x="130" y="88">RECIPIENT ACCOUNT</text>
    <text x="350" y="88">RATE / SEC</text>
    <text x="490" y="88">TOTAL ALLOC</text>
    <text x="630" y="88">STATUS</text>
  </g>

  <!-- Row 1 -->
  <g font-family="monospace" font-size="12" fill="#E2E8F0">
    <line x1="100" y1="110" x2="700" y2="110" stroke="#047857" stroke-width="1" opacity="0.3" />
    <text x="130" y="136" fill="#34D399">GB3X...7L9K (Lead Dev)</text>
    <text x="350" y="136">0.025 USDC/s</text>
    <text x="490" y="136">5,000.00</text>
    <text x="630" y="136" fill="#10B981">● ACTIVE</text>
  </g>

  <!-- Row 2 -->
  <g font-family="monospace" font-size="12" fill="#E2E8F0">
    <line x1="100" y1="160" x2="700" y2="160" stroke="#047857" stroke-width="1" opacity="0.3" />
    <text x="130" y="186" fill="#34D399">GCEK...99AA (Designer)</text>
    <text x="350" y="186">0.018 USDC/s</text>
    <text x="490" y="186">3,500.00</text>
    <text x="630" y="186" fill="#10B981">● ACTIVE</text>
  </g>

  <!-- Row 3 -->
  <g font-family="monospace" font-size="12" fill="#E2E8F0">
    <line x1="100" y1="210" x2="700" y2="210" stroke="#047857" stroke-width="1" opacity="0.3" />
    <text x="130" y="236" fill="#34D399">GA8Q...4RZZ (Product)</text>
    <text x="350" y="236">0.021 USDC/s</text>
    <text x="490" y="236">4,200.00</text>
    <text x="630" y="236" fill="#10B981">● ACTIVE</text>
  </g>

  <!-- Row 4 -->
  <g font-family="monospace" font-size="12" fill="#E2E8F0">
    <line x1="100" y1="260" x2="700" y2="260" stroke="#047857" stroke-width="1" opacity="0.3" />
    <text x="130" y="286" fill="#34D399">GDD2...11BC (Security)</text>
    <text x="350" y="286">0.030 USDC/s</text>
    <text x="490" y="286">6,000.00</text>
    <text x="630" y="286" fill="#10B981">● ACTIVE</text>
  </g>

  <!-- Row 5 (Bulk CSV footer) -->
  <line x1="100" y1="310" x2="700" y2="310" stroke="#047857" stroke-width="1" opacity="0.3" />
  <text x="400" y="345" fill="#6EE7B7" font-family="monospace" font-size="12" font-weight="600" text-anchor="middle">⚡ +48 additional recipients in batch payload</text>

  <!-- Bottom CTA -->
  <text x="400" y="415" fill="#ECFDF5" font-family="sans-serif" font-size="15" font-weight="600" text-anchor="middle">Single-Transaction Atomic Payroll Distribution</text>
</svg>