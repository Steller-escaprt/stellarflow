<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad3)" rx="16" />

  <!-- Flow Wave Lines -->
  <path d="M 50 220 Q 200 120 400 220 T 750 220" fill="none" stroke="#06B6D4" stroke-width="3" opacity="0.8" />
  <path d="M 50 240 Q 220 340 400 240 T 750 240" fill="none" stroke="#8B5CF6" stroke-width="3" opacity="0.7" />
  <path d="M 50 230 Q 250 160 420 230 T 750 230" fill="none" stroke="#EC4899" stroke-width="2" opacity="0.5" stroke-dasharray="8,6" />

  <!-- Flowing Particles -->
  <circle cx="150" cy="180" r="5" fill="#38BDF8" />
  <circle cx="280" cy="200" r="6" fill="#A855F7" />
  <circle cx="360" cy="235" r="4" fill="#34D399" />
  <circle cx="480" cy="225" r="7" fill="#F472B6" />
  <circle cx="610" cy="190" r="5" fill="#38BDF8" />

  <!-- Speedometer Card Overlay -->
  <rect x="220" y="80" width="360" height="130" rx="16" fill="#1E293B" fill-opacity="0.9" stroke="#334155" stroke-width="1.5" />
  <text x="400" y="115" fill="#94A3B8" font-family="monospace" font-size="12" text-anchor="middle">LIVE PROTOCOL VELOCITY</text>
  <text x="400" y="165" fill="#38BDF8" font-family="monospace" font-size="34" font-weight="bold" text-anchor="middle">+0.0842 XLM/s</text>
  <text x="400" y="195" fill="#10B981" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚡ 5.0520 XLM / Minute Flowing</text>

  <!-- Metrics Ticker at bottom -->
  <g font-family="monospace" font-size="13" fill="#E2E8F0">
    <rect x="100" y="360" width="180" height="42" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
    <text x="190" y="386" text-anchor="middle" fill="#A78BFA">GAS: &lt;$0.00001</text>
    
    <rect x="310" y="360" width="180" height="42" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
    <text x="400" y="386" text-anchor="middle" fill="#34D399">BLOCK TIME: 5.0s</text>

    <rect x="520" y="360" width="180" height="42" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
    <text x="610" y="386" text-anchor="middle" fill="#38BDF8">TPS: 1,000+ MAX</text>
  </g>
</svg>
