<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.0" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad1)" rx="16" />
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.12" stroke="#FFFFFF" stroke-width="1">
    <line x1="100" y1="50" x2="100" y2="380" />
    <line x1="250" y1="50" x2="250" y2="380" />
    <line x1="400" y1="50" x2="400" y2="380" />
    <line x1="550" y1="50" x2="550" y2="380" />
    <line x1="700" y1="50" x2="700" y2="380" />
    <line x1="80" y1="100" x2="720" y2="100" />
    <line x1="80" y1="180" x2="720" y2="180" />
    <line x1="80" y1="260" x2="720" y2="260" />
    <line x1="80" y1="340" x2="720" y2="340" />
  </g>

  <!-- Cliff Area (0% unlocked) -->
  <rect x="120" y="340" width="180" height="4" fill="#64748B" opacity="0.6" />
  <line x1="300" y1="100" x2="300" y2="340" stroke="#F59E0B" stroke-width="2" stroke-dasharray="6,4" />
  
  <!-- Vesting Area Polygon -->
  <polygon points="300,340 300,240 680,100 680,340" fill="url(#areaGrad)" />
  
  <!-- Main Vesting Slope -->
  <path d="M 120 340 L 300 340 L 300 240 L 680 100" fill="none" stroke="url(#lineGrad)" stroke-width="4" stroke-linecap="round" />
  
  <!-- Key Points -->
  <circle cx="120" cy="340" r="6" fill="#6366F1" stroke="#FFFFFF" stroke-width="2" />
  <circle cx="300" cy="240" r="7" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2" />
  <circle cx="680" cy="100" r="7" fill="#EC4899" stroke="#FFFFFF" stroke-width="2" />

  <!-- Formula & Badges -->
  <rect x="120" y="60" width="260" height="34" rx="8" fill="#1E293B" opacity="0.85" stroke="#334155" stroke-width="1" />
  <text x="135" y="82" fill="#E2E8F0" font-family="monospace" font-size="13" font-weight="600">V(t) = Total × (t - t₀) / D</text>
  
  <rect x="420" y="60" width="150" height="34" rx="8" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-width="1" />
  <text x="435" y="82" fill="#FBBF24" font-family="monospace" font-size="12" font-weight="bold">CLIFF PROTOCOL</text>

  <!-- Labels -->
  <text x="120" y="375" fill="#94A3B8" font-family="monospace" font-size="12" text-anchor="middle">Start (t₀)</text>
  <text x="300" y="375" fill="#FBBF24" font-family="monospace" font-size="12" text-anchor="middle">Cliff Lock (tc)</text>
  <text x="680" y="375" fill="#F472B6" font-family="monospace" font-size="12" text-anchor="middle">100% Vested (t₁)</text>
  
  <text x="500" y="420" fill="#CBD5E1" font-family="sans-serif" font-size="15" font-weight="600" text-anchor="middle">Continuous Second-by-Second Token Release</text>
</svg>
