<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.0" />
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad2)" rx="16" />
  <circle cx="400" cy="225" r="220" fill="url(#glow)" />

  <!-- Code Frame -->
  <rect x="100" y="70" width="600" height="300" rx="12" fill="#030712" stroke="#1F2937" stroke-width="1.5" />
  
  <!-- Header dots -->
  <circle cx="130" cy="95" r="5" fill="#EF4444" />
  <circle cx="146" cy="95" r="5" fill="#F59E0B" />
  <circle cx="162" cy="95" r="5" fill="#10B981" />
  <text x="400" y="99" fill="#9CA3AF" font-family="monospace" font-size="12" text-anchor="middle">stellar_flow_contract.rs (Soroban WASM)</text>

  <!-- Code Snippet -->
  <g font-family="monospace" font-size="13" xml:space="preserve">
    <text x="130" y="145" fill="#818CF8">#[contractimpl]</text>
    <text x="130" y="175" fill="#F472B6">impl <tspan fill="#38BDF8">StellarFlowContract</tspan> <tspan fill="#E5E7EB">{</tspan></text>
    <text x="160" y="205" fill="#FCD34D">pub fn <tspan fill="#38BDF8">create_stream</tspan><tspan fill="#94A3B8">(env: Env, from: Address, to: Address, amount: i128) -&gt; u64 {</tspan></text>
    <text x="190" y="235" fill="#4ADE80">token::Client::new(&amp;env, &amp;asset).transfer(&amp;from, &amp;env.current_contract_address(), &amp;amount);</text>
    <text x="190" y="265" fill="#E2E8F0">env.storage().instance().set(&amp;DataKey::Stream(id), &amp;stream);</text>
    <text x="190" y="295" fill="#A78BFA">env.events().publish((symbol_short!("created"),), (id, from, to));</text>
    <text x="160" y="325" fill="#94A3B8">}</text>
    <text x="130" y="345" fill="#E5E7EB">}</text>
  </g>

  <!-- Contract ID Pill -->
  <rect x="180" y="390" width="440" height="36" rx="18" fill="url(#badgeGrad)" opacity="0.9" />
  <text x="400" y="413" fill="#FFFFFF" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">CONTRACT: CCJW2RLIN4...CLBB553J74</text>
</svg>
