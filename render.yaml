services:
  - type: web
    name: stellarflow-backend
    runtime: node
    plan: starter
    region: oregon
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    disk:
      name: stellarflow-data
      mountPath: /data
      sizeGB: 10
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_PATH
        value: /data/streams.db
      - key: STELLAR_NETWORK
        value: testnet
      - key: RPC_URL
        value: https://soroban-testnet.stellar.org:443
      - key: NETWORK_PASSPHRASE
        value: "Test SDF Network ; September 2015"
      - key: HORIZON_URL
        value: https://horizon-testnet.stellar.org
      - key: ALLOWED_ASSETS
        value: USDC,XLM,EURC
      - key: ALLOWED_ORIGINS
        value: "https://stellarflow.vercel.app,http://localhost:3000"
      - key: ADMIN_API_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: CONTRACT_ID
        value: "CCJW2RLIN4MQQ4DAJMMR3F5QPDA6QYTKXJMEVI3XOTDBTBCLBB553J74"
      - key: SOROBAN_DISABLED
        value: "true"

