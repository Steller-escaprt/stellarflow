name: 💡 Feature Request
description: Propose an enhancement, new streaming curve, wallet integration, or Soroban capability
labels: ["enhancement", "discussion"]
body:
  - type: markdown
    attributes:
      value: |
        We welcome ideas for advancing continuous liquidity on Stellar!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem or limitation?
      description: A clear and concise description of the problem or friction point.
      placeholder: "e.g. Contractors struggle with..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: How should the feature work, and how does it integrate with Soroban/Stellar primitives?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative approaches considered
      description: Any alternative designs or workarounds you've evaluated.
